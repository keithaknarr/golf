services:
  - type: web
    name: golf
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: bash scripts/start-stable.sh
    healthCheckPath: /health
    disk:
      name: golf-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOLF_STATE_FILE
        value: /data/state.json
      - key: GOLF_HEALTH_FILE
        value: /data/health.json
