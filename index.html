<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Outing Tracker</title>
  <style>
    :root {
      --green: #2d7a3a;
      --green-light: #4caf50;
      --green-dark: #1b5e20;
      --gold: #f9a825;
      --gold-light: #ffd54f;
      --white: #ffffff;
      --gray-light: #f5f5f5;
      --gray: #9e9e9e;
      --text: #212121;
      --shadow: 0 4px 16px rgba(0,0,0,0.12);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #2d7a3a 50%, #388e3c 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* ── NAV ── */
    #app-nav {
      display: none;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 4px;
    }
    #app-nav .nav-brand {
      color: var(--gold);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      padding: 14px 8px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #app-nav button {
      background: none;
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 14px 12px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    #app-nav button:hover { color: white; }
    #app-nav button.active { color: var(--gold); border-bottom-color: var(--gold); }
    #app-nav { display: none; align-items: center; flex-wrap: wrap; }

    /* ── PAGES ── */
    .page { display: none; padding: 24px 16px; max-width: 720px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── CARD ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1.3rem; color: var(--green-dark); margin-bottom: 16px; }

    /* ── CHECK-IN SCREEN ── */
    #checkin-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      max-width: 100%;
      padding: 32px 16px;
    }
    .checkin-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .checkin-header .emoji { font-size: 4rem; margin-bottom: 8px; }
    .checkin-header h1 {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      letter-spacing: 2px;
    }
    .checkin-header p {
      color: rgba(255,255,255,0.85);
      font-size: 1.1rem;
      margin-top: 8px;
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 680px;
    }
    .player-btn {
      background: rgba(255,255,255,0.92);
      border: 3px solid transparent;
      border-radius: var(--radius);
      padding: 18px 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .player-btn:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      background: white;
    }
    .player-btn .player-avatar {
      font-size: 2.2rem;
      margin-bottom: 6px;
    }
    .player-btn .player-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--green-dark);
    }
    .player-btn .player-team {
      font-size: 0.75rem;
      color: var(--gray);
      margin-top: 2px;
    }

    /* ── WELCOME BANNER ── */
    #welcome-banner {
      background: linear-gradient(90deg, var(--green-dark), var(--green));
      color: white;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #welcome-banner .wb-avatar { font-size: 2rem; }
    #welcome-banner .wb-name { font-weight: 800; font-size: 1.2rem; }
    #welcome-banner .wb-team { font-size: 0.85rem; opacity: 0.85; }
    #welcome-banner .wb-change {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    #welcome-banner .wb-change:hover { background: rgba(255,255,255,0.35); }

    /* ── SCORE ENTRY ── */
    .team-score-block {
      margin-bottom: 8px;
    }
    .team-score-block .member-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-light);
    }
    .team-score-block .member-row:last-child { border-bottom: none; }
    .member-avatar { font-size: 1.4rem; width: 36px; text-align: center; }
    .member-name { flex: 1; font-weight: 600; font-size: 0.95rem; }
    .member-name.me { color: var(--green-dark); }
    .member-name.me::after { content: ' (you)'; font-weight: 400; color: var(--gray); font-size: 0.8rem; }
    .score-input {
      width: 64px;
      text-align: center;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green-dark);
      transition: border-color 0.2s;
    }
    .score-input:focus { outline: none; border-color: var(--green-light); }
    .score-total {
      font-weight: 800;
      font-size: 1rem;
      color: var(--green);
      width: 56px;
      text-align: right;
    }
    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--gray);
      padding: 0 0 6px 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .save-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .save-btn:hover { background: var(--green-dark); }
    .save-confirm {
      text-align: center;
      color: var(--green);
      font-weight: 600;
      margin-top: 8px;
      height: 20px;
      font-size: 0.9rem;
    }

    /* ── LEADERBOARD ── */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--gray-light);
      transition: all 0.2s;
    }
    .lb-row.my-team {
      background: linear-gradient(90deg, #e8f5e9, #f1f8e9);
      border: 2px solid var(--green-light);
      box-shadow: 0 2px 8px rgba(76,175,80,0.18);
    }
    .lb-rank {
      font-size: 1.4rem;
      font-weight: 900;
      width: 36px;
      text-align: center;
    }
    .lb-info { flex: 1; }
    .lb-team-name { font-weight: 700; font-size: 1rem; }
    .lb-players { font-size: 0.78rem; color: var(--gray); margin-top: 2px; }
    .lb-score { text-align: right; }
    .lb-total { font-size: 1.4rem; font-weight: 900; color: var(--green-dark); }
    .lb-diff {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 2px;
      text-align: center;
    }
    .lb-diff.leader { background: var(--gold-light); color: #5d4037; }
    .lb-diff.behind { background: #ffebee; color: #c62828; }
    .lb-diff.tied { background: #e3f2fd; color: #1565c0; }
    .lb-diff.ahead { background: #e8f5e9; color: #1b5e20; }
    .you-badge {
      background: var(--gold);
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .no-scores-msg {
      text-align: center;
      color: var(--gray);
      padding: 24px;
      font-size: 0.95rem;
    }

    /* ── HOLE TABS ── */
    .hole-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .hole-tab {
      background: var(--gray-light);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--gray);
    }
    .hole-tab.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .hole-tab.has-score {
      border-color: var(--green-light);
      color: var(--green-dark);
    }

    /* responsive */
    @media (max-width: 480px) {
      .checkin-header h1 { font-size: 1.8rem; }
      .player-grid { grid-template-columns: repeat(2, 1fr); }
      .score-input { width: 52px; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav id="app-nav">
  <div class="nav-brand">⛳ Golf Tracker</div>
  <button id="nav-scores" onclick="showPage('scores')">Scores</button>
  <button id="nav-leaderboard" onclick="showPage('leaderboard')">Leaderboard</button>
</nav>

<!-- ── CHECK-IN PAGE ── -->
<div id="checkin-page" class="page active">
  <div class="checkin-header">
    <div class="emoji">⛳</div>
    <h1>WHO AM I?</h1>
    <p>Select your name to get started</p>
  </div>
  <div class="player-grid" id="player-grid"></div>
</div>

<!-- ── SCORES PAGE ── -->
<div id="scores-page" class="page">
  <div id="welcome-banner">
    <div class="wb-avatar"></div>
    <div>
      <div class="wb-name"></div>
      <div class="wb-team"></div>
    </div>
    <button class="wb-change" onclick="changePlayer()">Change Player</button>
  </div>

  <div class="card">
    <h2>🏌️ Enter Team Scores</h2>
    <div style="margin-bottom:12px;">
      <label style="font-size:0.85rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;">Hole</label>
      <div class="hole-tabs" id="hole-tabs"></div>
    </div>
    <div class="score-label">
      <span>Player</span>
      <span>Hole Score &nbsp;&nbsp; Running Total</span>
    </div>
    <div id="score-rows"></div>
    <button class="save-btn" onclick="saveScores()">💾 Save Scores</button>
    <div class="save-confirm" id="save-confirm"></div>
  </div>
</div>

<!-- ── LEADERBOARD PAGE ── -->
<div id="leaderboard-page" class="page">
  <div id="lb-welcome-banner" class="card" style="background:linear-gradient(90deg,#1b5e20,#2d7a3a);color:white;padding:16px 20px;">
    <div style="font-size:1.1rem;font-weight:800;color:var(--gold);">⛳ Golf Outing Leaderboard</div>
    <div id="lb-subtitle" style="font-size:0.85rem;opacity:0.85;margin-top:4px;"></div>
  </div>
  <div class="card">
    <h2>🏆 Team Standings</h2>
    <div id="leaderboard-list"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════
const TEAMS = [
  {
    id: 'team1',
    name: 'Eagle Squad',
    color: '#2d7a3a',
    players: [
      { id: 'p1', name: 'Mike Johnson',  avatar: '🧑' },
      { id: 'p2', name: 'Sarah Lee',     avatar: '👩' },
      { id: 'p3', name: 'Tom Wilson',    avatar: '🧔' },
      { id: 'p4', name: 'Chris Davis',   avatar: '👨' },
    ]
  },
  {
    id: 'team2',
    name: 'Birdie Brigade',
    color: '#1565c0',
    players: [
      { id: 'p5', name: 'Amy Chen',      avatar: '👩‍🦱' },
      { id: 'p6', name: 'Jake Smith',    avatar: '🧑‍🦳' },
      { id: 'p7', name: 'Diane Moore',   avatar: '👱‍♀️' },
      { id: 'p8', name: 'Rob Taylor',    avatar: '🧑‍🦰' },
    ]
  },
  {
    id: 'team3',
    name: 'Par Busters',
    color: '#7b1fa2',
    players: [
      { id: 'p9',  name: 'Lisa Brown',   avatar: '👩‍🦲' },
      { id: 'p10', name: 'Kevin White',  avatar: '🧑‍💼' },
      { id: 'p11', name: 'Tara Green',   avatar: '👩‍🦱' },
      { id: 'p12', name: 'Dan Harris',   avatar: '🧑‍🎤' },
    ]
  },
  {
    id: 'team4',
    name: 'Bogey Boys',
    color: '#e65100',
    players: [
      { id: 'p13', name: 'Steve Clark',  avatar: '🧓' },
      { id: 'p14', name: 'Nina Patel',   avatar: '👩‍🔬' },
      { id: 'p15', name: 'Frank Lewis',  avatar: '👨‍🦲' },
      { id: 'p16', name: 'Grace Kim',    avatar: '👩‍🎨' },
    ]
  }
];

const HOLES = 18;

// ══════════════════════════════════════════════
//  STATE  (persisted to localStorage)
// ══════════════════════════════════════════════
let currentPlayer = null;   // { id, name, avatar, teamId }
let currentHole   = 1;
// scores[playerId][hole] = strokes (number)
let scores = {};

function loadState() {
  try {
    const saved = localStorage.getItem('golfState');
    if (saved) {
      const s = JSON.parse(saved);
      currentPlayer = s.currentPlayer || null;
      scores        = s.scores || {};
    }
  } catch(e) { /* ignore */ }
}

function saveState() {
  try {
    localStorage.setItem('golfState', JSON.stringify({ currentPlayer, scores }));
  } catch(e) { /* ignore */ }
}

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function getTeamForPlayer(playerId) {
  return TEAMS.find(t => t.players.some(p => p.id === playerId));
}

function getPlayer(playerId) {
  for (const t of TEAMS) {
    const p = t.players.find(p => p.id === playerId);
    if (p) return p;
  }
  return null;
}

function teamTotal(teamId) {
  const team = TEAMS.find(t => t.id === teamId);
  if (!team) return 0;
  return team.players.reduce((sum, p) => {
    const ps = scores[p.id] || {};
    return sum + Object.values(ps).reduce((a, b) => a + b, 0);
  }, 0);
}

function hasAnyScore() {
  return Object.values(scores).some(ps => Object.keys(ps).length > 0);
}

// ══════════════════════════════════════════════
//  PAGE ROUTER
// ══════════════════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('#app-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(name + '-page').classList.add('active');
  const navBtn = document.getElementById('nav-' + name);
  if (navBtn) navBtn.classList.add('active');

  if (name === 'scores')      renderScoresPage();
  if (name === 'leaderboard') renderLeaderboard();
}

function showCheckin() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('checkin-page').classList.add('active');
  document.getElementById('app-nav').style.display = 'none';
}

// ══════════════════════════════════════════════
//  CHECK-IN
// ══════════════════════════════════════════════
function renderCheckin() {
  const grid = document.getElementById('player-grid');
  grid.innerHTML = '';
  TEAMS.forEach(team => {
    team.players.forEach(player => {
      const btn = document.createElement('button');
      btn.className = 'player-btn';
      btn.innerHTML = `
        <div class="player-avatar">${player.avatar}</div>
        <div class="player-name">${player.name}</div>
        <div class="player-team">${team.name}</div>
      `;
      btn.onclick = () => checkIn(player.id);
      grid.appendChild(btn);
    });
  });
}

function checkIn(playerId) {
  const player = getPlayer(playerId);
  const team   = getTeamForPlayer(playerId);
  currentPlayer = { id: playerId, name: player.name, avatar: player.avatar, teamId: team.id };
  saveState();
  document.getElementById('app-nav').style.display = 'flex';
  showPage('scores');
}

function changePlayer() {
  currentPlayer = null;
  saveState();
  showCheckin();
  renderCheckin();
}

// ══════════════════════════════════════════════
//  SCORES PAGE
// ══════════════════════════════════════════════
function renderScoresPage() {
  if (!currentPlayer) return;
  const team = TEAMS.find(t => t.id === currentPlayer.teamId);

  // welcome banner
  const banner = document.getElementById('welcome-banner');
  banner.querySelector('.wb-avatar').textContent = currentPlayer.avatar;
  banner.querySelector('.wb-name').textContent   = currentPlayer.name;
  banner.querySelector('.wb-team').textContent   = '🏌️ ' + team.name;

  // hole tabs
  renderHoleTabs();

  // score rows
  renderScoreRows();
}

function renderHoleTabs() {
  const container = document.getElementById('hole-tabs');
  container.innerHTML = '';
  const team = TEAMS.find(t => t.id === currentPlayer.teamId);
  for (let h = 1; h <= HOLES; h++) {
    const tab = document.createElement('button');
    tab.className = 'hole-tab';
    if (h === currentHole) tab.classList.add('active');
    // check if any team member has score for this hole
    const hasScore = team.players.some(p => scores[p.id] && scores[p.id][h] !== undefined);
    if (hasScore) tab.classList.add('has-score');
    tab.textContent = h;
    tab.onclick = () => { currentHole = h; renderHoleTabs(); renderScoreRows(); };
    container.appendChild(tab);
  }
}

function renderScoreRows() {
  const container = document.getElementById('score-rows');
  const team      = TEAMS.find(t => t.id === currentPlayer.teamId);
  container.innerHTML = '';
  team.players.forEach(player => {
    const ps    = scores[player.id] || {};
    const hole  = currentHole;
    const val   = ps[hole] !== undefined ? ps[hole] : '';
    const total = Object.values(ps).reduce((a, b) => a + b, 0);
    const isMe  = player.id === currentPlayer.id;

    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <div class="member-avatar">${player.avatar}</div>
      <div class="member-name${isMe ? ' me' : ''}">${player.name}</div>
      <input class="score-input" type="number" min="1" max="15"
             value="${val}" placeholder="–"
             data-player="${player.id}" />
      <div class="score-total">${total > 0 ? total : '–'}</div>
    `;
    container.appendChild(row);
  });
}

function saveScores() {
  const inputs = document.querySelectorAll('.score-input');
  inputs.forEach(input => {
    const playerId = input.dataset.player;
    const val      = parseInt(input.value);
    if (!scores[playerId]) scores[playerId] = {};
    if (!isNaN(val) && val > 0) {
      scores[playerId][currentHole] = val;
    } else {
      delete scores[playerId][currentHole];
    }
  });
  saveState();
  renderHoleTabs();
  renderScoreRows();

  const confirm = document.getElementById('save-confirm');
  confirm.textContent = '✅ Scores saved!';
  setTimeout(() => { confirm.textContent = ''; }, 2500);
}

// ══════════════════════════════════════════════
//  LEADERBOARD
// ══════════════════════════════════════════════
function renderLeaderboard() {
  const list = document.getElementById('leaderboard-list');

  if (!hasAnyScore()) {
    list.innerHTML = '<div class="no-scores-msg">No scores entered yet.<br>Enter some scores to see the leaderboard!</div>';
    if (currentPlayer) {
      const team = TEAMS.find(t => t.id === currentPlayer.teamId);
      document.getElementById('lb-subtitle').textContent =
        `${currentPlayer.avatar} ${currentPlayer.name}  ·  ${team.name}`;
    }
    return;
  }

  // build standings
  const standings = TEAMS.map(team => ({
    team,
    total: teamTotal(team.id)
  })).sort((a, b) => {
    // teams with 0 go last
    if (a.total === 0 && b.total === 0) return 0;
    if (a.total === 0) return 1;
    if (b.total === 0) return -1;
    return a.total - b.total;
  });

  const leaderTotal = standings[0].total;

  list.innerHTML = '';
  standings.forEach((entry, idx) => {
    const isMyTeam = currentPlayer && entry.team.id === currentPlayer.teamId;
    const rankEmojis = ['🥇','🥈','🥉'];
    const rank = rankEmojis[idx] || `#${idx+1}`;
    const diff = entry.total - leaderTotal;

    let diffHtml = '';
    if (entry.total === 0) {
      diffHtml = '<div class="lb-diff tied">No scores</div>';
    } else if (idx === 0) {
      diffHtml = '<div class="lb-diff leader">LEADER</div>';
    } else if (diff > 0) {
      diffHtml = `<div class="lb-diff behind">+${diff} strokes back</div>`;
    } else {
      diffHtml = '<div class="lb-diff tied">TIED</div>';
    }

    const playerNames = entry.team.players.map(p => {
      const isMe = currentPlayer && p.id === currentPlayer.id;
      return isMe ? `<strong>${p.name}</strong>` : p.name;
    }).join(', ');

    const row = document.createElement('div');
    row.className = 'lb-row' + (isMyTeam ? ' my-team' : '');
    row.innerHTML = `
      <div class="lb-rank">${rank}</div>
      <div class="lb-info">
        <div class="lb-team-name">
          ${entry.team.name}
          ${isMyTeam ? '<span class="you-badge">YOUR TEAM</span>' : ''}
        </div>
        <div class="lb-players">${playerNames}</div>
      </div>
      <div class="lb-score">
        <div class="lb-total">${entry.total > 0 ? entry.total : '–'}</div>
        ${diffHtml}
      </div>
    `;
    list.appendChild(row);
  });

  if (currentPlayer) {
    const myStanding = standings.findIndex(e => e.team.id === currentPlayer.teamId) + 1;
    const myTotal    = teamTotal(currentPlayer.teamId);
    const team = TEAMS.find(t => t.id === currentPlayer.teamId);
    document.getElementById('lb-subtitle').textContent =
      `${currentPlayer.avatar} ${currentPlayer.name}  ·  ${team.name}  ·  Total: ${myTotal || '–'}  ·  Rank: #${myStanding}`;
  }
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
loadState();
renderCheckin();

if (currentPlayer) {
  document.getElementById('app-nav').style.display = 'flex';
  showPage('scores');
} else {
  showCheckin();
}
</script>
</body>
</html>
